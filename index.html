<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIRROR OS — Your reflection. Your personal assistant.</title>
<meta name="description" content="MIRROR OS: lo specchio intelligente con assistente AI per outfit, casa e giornata. Concept progettuale. / The smart mirror with an AI assistant. Project concept.">
<style>
:root{--bg:#080A0F;--fg:#fff;--mut:#9aa1b2;--card:#11141c;--line:#232838;--acc:#547BFF;--gr:#F2F3F5;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 "Helvetica Neue",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgba(8,10,15,.9);z-index:60}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:0}
h1{font-size:clamp(2.4rem,6vw,4.8rem)}h2{font-size:clamp(1.8rem,4vw,3rem)}h3{font-size:1.25rem}
p{margin:0}.mut{color:var(--mut)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(8,10,15,.82);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:auto;display:flex;align-items:center;gap:20px;padding:14px 24px}
.logo{font-weight:700;letter-spacing:.18em;font-size:1.05rem}.logo b{color:var(--acc)}
nav{display:flex;gap:26px;margin-left:auto;font-size:.92rem;color:var(--mut)}
nav a:hover,nav a.on{color:#fff}
.tools{display:flex;gap:10px;align-items:center}
.ic{background:none;border:1px solid var(--line);color:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font:inherit;font-size:.85rem;transition:.25s}
.ic:hover{border-color:var(--acc);background:rgba(84,123,255,.12)}
#burger{display:none}
.btn{display:inline-block;border:0;cursor:pointer;font:inherit;font-weight:500;padding:14px 28px;border-radius:999px;background:var(--acc);color:#fff;transition:transform .25s,box-shadow .25s,background .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(84,123,255,.4)}
.btn.g{background:transparent;border:1px solid #3a4157}.btn.g:hover{background:rgba(255,255,255,.07);box-shadow:none}
.btn:focus-visible,.ic:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
section{max-width:1200px;margin:auto;padding:90px 24px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;min-height:82vh}
.hero p.sub{font-size:1.25rem;color:var(--mut);margin:22px 0 34px;max-width:30em}
.row{display:flex;gap:14px;flex-wrap:wrap}
.room{position:relative;display:grid;place-items:center;padding:30px;border-radius:32px;background:radial-gradient(circle at 50% 30%,rgba(84,123,255,.35),transparent 60%),linear-gradient(160deg,#141926,#0a0d14);border:1px solid var(--line)}
.room svg{width:min(100%,330px);height:auto;filter:drop-shadow(0 30px 40px rgba(0,0,0,.6));animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.eyebrow{color:var(--acc);font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px;display:block}
.head{text-align:center;margin-bottom:50px}.head p{margin-top:14px;color:var(--mut)}
.grid{display:grid;gap:20px}.g4{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;transition:transform .3s,border-color .3s}
.card:hover{transform:translateY(-5px);border-color:var(--acc)}
.num{color:var(--acc);font-size:.85rem;letter-spacing:.15em;display:block;margin-bottom:30px}
.card h3{margin-bottom:8px}.card p{color:var(--mut);font-size:.95rem}
.pc{display:flex;flex-direction:column;position:relative}
.pc.top{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 20px 60px rgba(84,123,255,.18)}
.badge{position:absolute;top:18px;right:18px;background:var(--acc);font-size:.7rem;padding:3px 10px;border-radius:999px;letter-spacing:.1em}
.pc .mini{background:#0b0e16;border-radius:16px;overflow:hidden;margin-bottom:20px}
.pc .mini img{display:block;width:100%;aspect-ratio:4/5;height:auto;object-fit:cover;object-position:center;transition:transform .6s}.pc:hover .mini img{transform:scale(1.04)}
.room.ph{padding:0;overflow:hidden}.room.ph img{display:block;width:100%;height:auto}
.ln img{width:80px;height:100px;object-fit:cover;object-position:center;border-radius:12px}
.price{font-size:1.9rem;font-weight:600;margin:10px 0}
ul.ck{list-style:none;padding:0;margin:14px 0 24px;color:#cfd3de;font-size:.93rem}
ul.ck li{padding:5px 0 5px 24px;position:relative}
ul.ck li::before{content:"";position:absolute;left:0;top:13px;width:10px;height:6px;border-left:2px solid var(--acc);border-bottom:2px solid var(--acc);transform:rotate(-45deg)}
.pc .row{margin-top:auto}
.steps{counter-reset:s;display:grid;gap:14px}
.step{display:flex;gap:16px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line)}
.step::before{counter-increment:s;content:counter(s);flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(84,123,255,.15);color:var(--acc);font-weight:600}
.split{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center}
.wx{background:linear-gradient(160deg,#18203a,#0d1120);border:1px solid var(--line);border-radius:28px;padding:30px;text-align:center}
.wx big{font-size:3.4rem;font-weight:300;display:block}
.fit{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:24px 0 10px}
.fit div{width:92px;text-align:center;font-size:.75rem;color:var(--mut)}
.fit svg{width:92px;height:92px;background:#0b0e16;border-radius:18px;margin-bottom:6px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:20px}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{padding:16px 18px;text-align:left;border-bottom:1px solid var(--line);font-size:.93rem}
th{font-weight:600}td:first-child{color:var(--mut)}
tr:last-child td{border-bottom:0}
.ta{background:rgba(84,123,255,.09)}th.ta{border-top:2px solid var(--acc)}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:start}
.pd .room{position:sticky;top:90px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px}
.qty button{background:none;border:0;color:#fff;width:38px;height:38px;font-size:1.1rem;cursor:pointer}
.qty span{min-width:28px;text-align:center}
.ln{display:grid;grid-template-columns:90px 1fr auto;gap:18px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.ln svg{width:80px;height:auto;background:#0b0e16;border-radius:12px;padding:6px}
.sum{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px}
.sum .r{display:flex;justify-content:space-between;padding:7px 0}.sum .t{font-size:1.3rem;font-weight:600;border-top:1px solid var(--line);margin-top:10px;padding-top:16px}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:34px;align-items:start}
form{display:grid;gap:14px}
label{display:grid;gap:6px;font-size:.85rem;color:var(--mut)}
input,select{background:#0b0e16;border:1px solid var(--line);border-radius:12px;color:#fff;padding:13px 14px;font:inherit}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.note{background:rgba(84,123,255,.1);border:1px solid rgba(84,123,255,.35);border-radius:14px;padding:12px 16px;font-size:.85rem;color:#c7d3ff}
footer{border-top:1px solid var(--line);background:#05070b}
.fg{max-width:1200px;margin:auto;padding:56px 24px 30px;display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:30px}
.fg h4{margin:0 0 12px;font-size:.8rem;letter-spacing:.15em;text-transform:uppercase;color:var(--mut)}
.fg a,.fg span{display:block;padding:4px 0;color:#cfd3de;font-size:.92rem}.fg a:hover{color:var(--acc)}
.copy{max-width:1200px;margin:auto;padding:0 24px 30px;color:var(--mut);font-size:.8rem}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,120px);background:var(--acc);padding:12px 22px;border-radius:999px;transition:.4s;z-index:70}
#toast.on{transform:translate(-50%,0)}
.rv{opacity:0;transform:translateY(28px);transition:opacity .8s,transform .8s}.rv.in{opacity:1;transform:none}
.pg{animation:pi .5s}@keyframes pi{from{opacity:0}}
@media(max-width:860px){
#burger{display:inline-block}
nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:var(--bg);padding:20px 24px;border-bottom:1px solid var(--line);gap:16px}
nav.open{display:flex}
.hero,.split,.pd,.two{grid-template-columns:1fr}.pd .room{position:static}
.fg{grid-template-columns:1fr 1fr}section{padding:60px 20px}.f2{grid-template-columns:1fr}
}
.card{position:relative}
.card::after,.room.ph::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.24),transparent 45%);transition:opacity .3s}
.card:hover::after,.room.ph:hover::after{opacity:1}
.room.ph,.pc .mini{border:4px solid transparent;background:linear-gradient(#0b0e16,#0b0e16) padding-box,linear-gradient(135deg,#f4f5f8,#6c7386 30%,#d9dde6 55%,#555b6e 80%,#f4f5f8) border-box}
.room.ph{position:relative;border-radius:32px}
main h1,main h2{background:linear-gradient(100deg,#fff 38%,#8fa8ff 50%,#fff 62%) 0 0/300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shn 7s linear infinite}
@keyframes shn{from{background-position:120% 0}to{background-position:-20% 0}}
.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);transition:left .6s}
.btn:hover::after{left:130%}
.hero{position:relative}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(115deg,transparent 0 140px,rgba(255,255,255,.035) 140px 210px);background-size:420px 100%;animation:bm 14s linear infinite}
@keyframes bm{to{background-position:420px 0}}
#lt{position:fixed;left:0;top:0;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(84,123,255,.16),transparent 65%);pointer-events:none;z-index:40;opacity:0;transition:opacity .4s;mix-blend-mode:screen}
#sh{position:fixed;inset:0;z-index:90;pointer-events:none;transform:translateX(105%);background:linear-gradient(90deg,#8a93aa 0,#fff 3px,rgba(8,10,15,.97) 12px)}
#sh.go{animation:sw .85s cubic-bezier(.7,0,.2,1)}
@keyframes sw{from{transform:translateX(0)}to{transform:translateX(105%)}}
.room.ph canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;cursor:crosshair;touch-action:pan-y;border-radius:inherit}
.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(8,10,15,.6);backdrop-filter:blur(8px);padding:6px 14px;border-radius:999px;font-size:.8rem;transition:opacity .6s;pointer-events:none;z-index:3;white-space:nowrap}
@media(min-width:861px){.hero .room.ph,.pd .room.ph{-webkit-box-reflect:below 8px linear-gradient(transparent 82%,rgba(255,255,255,.22))}}
.tg{position:relative;display:grid;grid-template-columns:1fr minmax(260px,340px) 1fr;grid-template-rows:repeat(12,auto);column-gap:100px;align-items:center}
@keyframes fo{from{opacity:0}}
.tm{grid-column:2;grid-row:1/13;position:relative;z-index:1;animation:fo .9s both}
.tm .room.ph{box-shadow:0 0 90px rgba(84,123,255,.35)}
.tm .room.ph img{aspect-ratio:3/4;object-fit:cover;object-position:center}
.tk{position:relative;z-index:1;margin:8px 0;animation:fo .8s both}
.tk .num{margin-bottom:10px}
.tk[data-i="0"]{grid-column:1;grid-row:1/4}.tk[data-i="1"]{grid-column:1;grid-row:4/7}.tk[data-i="2"]{grid-column:1;grid-row:7/10}.tk[data-i="3"]{grid-column:1;grid-row:10/13}
.tk[data-i="4"]{grid-column:3;grid-row:1/5}.tk[data-i="5"]{grid-column:3;grid-row:5/9}.tk[data-i="6"]{grid-column:3;grid-row:9/13}
#tsv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#tsv path{fill:none;stroke:#547BFF;stroke-width:1.8;filter:drop-shadow(0 0 4px rgba(84,123,255,.8))}
#tsv path.dr{animation:dr 1.3s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
#tsv circle{fill:#fff;filter:drop-shadow(0 0 6px #547BFF)}
@media(max-width:860px){.tg{display:block}#tsv{display:none}.tm{margin-bottom:22px}.tk{margin:0 0 14px}}
.logo{display:inline-flex;align-items:center;gap:10px}.lm{width:22px;height:28px;flex:none;transition:transform .4s}.logo:hover .lm{transform:rotate(-6deg) scale(1.08)}
#tsv{z-index:2}
.f8 .tk[data-i="4"]{grid-column:3;grid-row:1/4}.f8 .tk[data-i="5"]{grid-column:3;grid-row:4/7}.f8 .tk[data-i="6"]{grid-column:3;grid-row:7/10}.f8 .tk[data-i="7"]{grid-column:3;grid-row:10/13}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>

<main id="app"></main>

const cmp=()=>`<section>${head(L(["Confronto","Compare"]),L(["Confronta i modelli","Compare the models"]),"")}<div class="tw rv"><table><thead><tr><th></th><th>LUMI</th><th>NOVA</th><th class="ta">AURA <span class="badge" style="position:static;margin-left:6px">TOP</span></th></tr></thead><tbody>${CMP.map(r=>`<tr><td>${L(r[0])}</td><td>${L(r[1])}</td><td>${L(r[2])}</td><td class="ta">${L(r[3])}</td></tr>`).join("")}</tbody></table></div></section>`;

<section>${head(L(["Funzionalità","Features"]),"One mirror. Endless possibilities.","")}<div class="tg f8" id="tg"><svg id="tsv" aria-hidden="true"></svg><div class="tm"><div class="room ph">${big("lumi")}</div></div>${FEAT.map((f,i)=>`<div class="card tk" data-i="${i}"><span class="num">0${i+1}</span><h3>${f[0]}</h3><p>${L([f[1],f[2]])}</p></div>`).join("")}</div></section>
${outfit()}<section>${head(L(["La gamma","The range"]),L(["Scegli il tuo MIRROR OS","Choose your MIRROR OS"]),"")}<div class="grid g3">${Object.keys(P).map(card).join("")}</div></section>`,
products:()=>`<section>${head(L(["La gamma MIRROR OS","The MIRROR OS range"]),L(["Tre modelli. Un’unica visione.","Three models. One vision."]),"")}<div class="grid g3">${Object.keys(P).map(card).join("")}</div></section>${cmp()}`,
outfit:()=>outfit(),tech:()=>techS()+cmp(),
about:()=>`<section style="max-width:800px;text-align:center">${head(L(["Chi siamo","About us"]),"Making everyday life smarter, one reflection at a time.","")}<p class="mut rv" style="font-size:1.1rem">${L(["MIRROR OS è un progetto di innovazione tecnologica sviluppato nell’ambito di Esprinet S.p.A. Il nostro obiettivo è integrare intelligenza artificiale e tecnologia nella vita quotidiana, trasformando uno strumento tradizionale in un assistente personale.","MIRROR OS is a technology innovation project developed within the Esprinet S.p.A. framework. Our goal is to bring artificial intelligence and technology into everyday life, turning a traditional object into a personal assistant."])}</p><div class="note rv" style="margin-top:30px">${L(["Concept progettuale: MIRROR OS è un prodotto ideato per un progetto scolastico, non è un prodotto Esprinet commercializzato. Nessun pagamento reale viene elaborato.","Project concept: MIRROR OS is a product designed for a school project, not a commercialized Esprinet product. No real payments are processed."])}</div><p class="mut rv" style="margin-top:30px">${L(["Contatti","Contact"])}: hello@mirror-os.example (demo)</p></section>`,
legal:()=>`<section style="max-width:760px"><h2>Privacy Policy · ${L(["Termini","Terms"])}</h2><p class="mut" style="margin-top:20px">${L(["Questo sito è una dimostrazione scolastica. I dati inseriti nel checkout non vengono inviati né salvati. Prezzi e prodotti sono fittizi.","This site is a school demo. Data entered at checkout is neither sent nor stored. Prices and products are fictional."])}</p></section>`,
cart:()=>{const ks=Object.keys(cart);const tot=ks.reduce((s,k)=>s+P[k].price*cart[k],0);return `<section><h2 style="margin-bottom:30px">${L(["Il tuo carrello","Your cart"])}</h2>${ks.length?`<div class="two"><div>${ks.map(k=>`<div class="ln"><div>${thumb(k)}</div><div><h3>MIRROR OS ${P[k].n}</h3><span class="mut">${eur(P[k].price)}</span><br><div class="qty"><button data-q="${k}" data-d="-1" aria-label="-">−</button><span>${cart[k]}</span><button data-q="${k}" data-d="1" aria-label="+">+</button></div></div><div><strong>${eur(P[k].price*cart[k])}</strong><br><button class="ic" data-rm="${k}" style="margin-top:8px">${L(["Rimuovi","Remove"])}</button></div></div>`).join("")}</div>${sum(tot)}<a class="btn" href="#checkout" style="display:block;text-align:center;margin-top:16px">${L(["Vai al checkout","Checkout"])}</a></div>`:`<p class="mut">${L(["Il carrello è vuoto.","Your cart is empty."])}</p><a class="btn" href="#products" style="margin-top:20px">${L(["Scopri la gamma","See the range"])}</a>`}</section>`},
checkout:()=>{const ks=Object.keys(cart);if(!ks.length){location.hash="products";return ""}const tot=ks.reduce((s,k)=>s+P[k].price*cart[k],0);return `<section><h2 style="margin-bottom:30px">Checkout</h2><div class="two"><form id="co"><div class="note">${L(["Checkout dimostrativo: nessun pagamento reale e nessun dato viene salvato.","Demo checkout: no real payment, no data is stored."])}</div><div class="f2"><label>${L(["Nome","First name"])}<input required autocomplete="given-name"></label><label>${L(["Cognome","Last name"])}<input required autocomplete="family-name"></label></div><label>Email<input type="email" required autocomplete="email"></label><label>${L(["Indirizzo","Address"])}<input required autocomplete="street-address"></label><div class="f2"><label>${L(["Città","City"])}<input required></label><label>CAP / ZIP<input required inputmode="numeric"></label></div><label>${L(["Metodo di pagamento","Payment method"])}<select><option>${L(["Pagamento simulato (demo)","Simulated payment (demo)"])}</option></select></label><button class="btn" type="submit">${L(["Conferma ordine","Place order"])}</button></form><div>${sum(tot)}</div></div></section>`},
done:()=>`<section style="text-align:center;max-width:640px"><span class="eyebrow">✓</span><h2>${L(["Ordine confermato (simulato)","Order confirmed (simulated)"])}</h2><p class="mut" style="margin:18px 0">${L(["Grazie! Questo è un ordine dimostrativo: nessun addebito è stato effettuato.","Thank you! This is a demo order: nothing was charged."])}</p><p>#MOS-${window.oid||"00000"}</p><a class="btn" href="#home" style="margin-top:26px">${L(["Torna alla home","Back to home"])}</a></section>`};
function sum(t){return `<div class="sum"><h3 style="margin-bottom:12px">${L(["Riepilogo","Summary"])}</h3>${Object.keys(cart).map(k=>`<div class="r"><span>${P[k].n} × ${cart[k]}</span><span>${eur(P[k].price*cart[k])}</span></div>`).join("")}<div class="r"><span>${L(["Spedizione","Shipping"])}</span><span>${L(["Gratuita","Free"])}</span></div><div class="r t"><span>${L(["Totale (IVA incl.)","Total (VAT incl.)"])}</span><span>${eur(t)}</span></div></div>`}
function detail(k){const p=P[k],o=Object.keys(P).filter(x=>x!=k);return `<section><div class="pd"><div class="room ph">${big(k)}</div><div><span class="eyebrow">${L(p.tag)}</span><h1 style="font-size:clamp(2rem,4vw,3.2rem)">MIRROR OS ${p.n}</h1><div class="price">${eur(p.price)}</div><p class="mut">${L(p.d)}</p><h3 style="margin-top:28px">${L(["Tecnologie","Technologies"])}</h3><ul class="ck">${p.tech.map(t=>`<li>${L(t)}</li>`).join("")}</ul><h3>${L(["Vantaggi","Benefits"])}</h3><ul class="ck">${p.ben.map(t=>`<li>${L(t)}</li>`).join("")}</ul><h3>${L(["Specifiche tecniche","Specifications"])}</h3><div class="tw" style="margin:14px 0 26px"><table style="min-width:0">${p.spec.map(s=>`<tr><td>${L([s[0],{Display:"Display",Connettività:"Connectivity",Dimensioni:"Size",Aggiornamenti:"Updates"}[s[0]]])}</td><td>${s[1]}</td></tr>`).join("")}</table></div><div class="row"><button class="btn" data-add="${k}">${L(["Acquista ora","Buy now"])} · ${eur(p.price)}</button><a class="btn g" href="#products">${L(["Confronta i modelli","Compare models"])}</a></div><p class="mut" style="margin-top:18px;font-size:.9rem">${L(["Vedi anche","See also"])}: ${o.map(x=>`<a href="#${x}" style="color:var(--acc)">${P[x].n}</a>`).join(" · ")}</p></div></div></section>`}
/* ---------- APP ---------- */
const NAV=[["home",["Home","Home"]],["products",["Prodotti","Products"]],["outfit",["Outfit Assistant","Outfit Assistant"]],["tech",["Tecnologia","Technology"]],["about",["Chi siamo","About"]]];
function cnt(){return Object.values(cart).reduce((a,b)=>a+b,0)}
function render(){
 document.documentElement.lang=lang;
 const r=location.hash.slice(1)||"home";
 $("#nav").innerHTML=NAV.map(n=>`<a href="#${n[0]}" class="${n[0]==r?"on":""}">${L(n[1])}</a>`).join("");
 $("#nav").classList.remove("open");
 $("#lg").textContent=lang=="it"?"EN":"IT";
 $("#ct").textContent=(lang=="it"?"Carrello":"Cart")+" ("+cnt()+")";
 const h=P[r]?detail(r):(V[r]||V.home)();
 $("#app").innerHTML=`<div class="pg">${h}</div>`;
 $("#ft").innerHTML=`<div class="fg"><div><div class="logo"><svg class="lm" viewBox="0 0 32 40" aria-hidden="true"><rect x="3" y="2" width="26" height="36" rx="9" fill="none" stroke="#cfd3de" stroke-width="2.5"/><rect x="7.5" y="6.5" width="17" height="27" rx="5.5" fill="#0b0e16"/><path d="M10 28L21 9" stroke="#fff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/><circle cx="21" cy="26" r="3" fill="#547BFF"/></svg><span>MIRROR<b> OS</b></span></div><p class="mut" style="margin-top:12px;font-size:.9rem">Your reflection. Your personal assistant.</p></div><div><h4>${L(["Esplora","Explore"])}</h4><a href="#about">${L(["Chi siamo","About"])}</a><a href="#products">${L(["Prodotti","Products"])}</a><a href="#tech">${L(["Tecnologia","Technology"])}</a></div><div><h4>${L(["Assistenza","Support"])}</h4><a href="#about">${L(["Contatti","Contact"])}</a><a href="#legal">Privacy Policy</a><a href="#legal">${L(["Termini e condizioni","Terms & Conditions"])}</a></div><div><h4>Social</h4><span>Instagram</span><span>LinkedIn</span><span>YouTube</span></div></div><div class="copy">© 2026 MIRROR OS — ${L(["Concept progettuale scolastico ispirato a un’iniziativa di innovazione Esprinet S.p.A. Non è un prodotto commercializzato.","School project concept inspired by an Esprinet S.p.A. innovation initiative. Not a commercial product."])}</div>`;
 window.scrollTo(0,0);
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
 document.querySelectorAll(".rv").forEach(e=>io.observe(e));
 const f=$("#co");if(f)f.onsubmit=e=>{e.preventDefault();window.oid=Math.floor(10000+Math.random()*89999);cart={};location.hash="done";if(location.hash=="#done")render()};
}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1800)}
document.addEventListener("click",e=>{
 const a=e.target.closest("[data-add]"),q=e.target.closest("[data-q]"),rm=e.target.closest("[data-rm]");
 if(a){cart[a.dataset.add]=(cart[a.dataset.add]||0)+1;$("#ct").textContent=(lang=="it"?"Carrello":"Cart")+" ("+cnt()+")";toast("MIRROR OS "+P[a.dataset.add].n+" "+L(["aggiunto al carrello","added to cart"]))}
 if(q){const k=q.dataset.q;cart[k]+=+q.dataset.d;if(cart[k]<1)delete cart[k];render()}
 if(rm){delete cart[rm.dataset.rm];render()}
});
$("#lg").onclick=()=>{lang=lang=="it"?"en":"it";try{localStorage.setItem("mo-lang",lang)}catch(e){}render()};
$("#ct").onclick=()=>location.hash="cart";
$("#burger").onclick=()=>$("#nav").classList.toggle("open");
window.addEventListener("hashchange",render);
render();
(function(){
const fine=matchMedia("(pointer:fine)").matches,rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
const lt=document.createElement("div");lt.id="lt";document.body.appendChild(lt);
const sh=document.createElement("div");sh.id="sh";document.body.appendChild(sh);
if(fine&&!rm)addEventListener("pointermove",e=>{lt.style.transform=`translate(${e.clientX-190}px,${e.clientY-190}px)`;lt.style.opacity=1});
addEventListener("hashchange",()=>{if(rm)return;sh.classList.remove("go");void sh.offsetWidth;sh.classList.add("go")});
function tilt(el){if(el._t)return;el._t=1;
el.addEventListener("pointermove",e=>{if(e.pointerType!="mouse"||rm)return;const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;el.style.setProperty("--mx",x*100+"%");el.style.setProperty("--my",y*100+"%");el.style.transition="transform .1s";el.style.transform=`perspective(900px) rotateY(${(x-.5)*10}deg) rotateX(${(.5-y)*10}deg) translateY(-4px)`});
el.addEventListener("pointerleave",()=>{el.style.transition="";el.style.transform=""})}
function fog(el){if(el._f||rm)return;el._f=1;const im=el.querySelector("img");
const go=()=>{const r=el.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);
const c=document.createElement("canvas");c.width=w;c.height=h;el.appendChild(c);
const x=c.getContext("2d"),f=document.createElement("canvas");f.width=w;f.height=h;const g=f.getContext("2d");
try{g.filter="blur("+14*d+"px)"}catch(e){}
g.drawImage(im,-20*d,-20*d,w+40*d,h+40*d);g.filter="none";g.fillStyle="rgba(232,238,250,.5)";g.fillRect(0,0,w,h);x.drawImage(f,0,0);
const hint=document.createElement("span");hint.className="hint";hint.textContent=L(["✋ Passa per pulire lo specchio","✋ Wipe the mirror clean"]);el.appendChild(hint);
const rad=46*d;
const wipe=(px,py,rd)=>{x.globalCompositeOperation="destination-out";const gr=x.createRadialGradient(px,py,0,px,py,rd);gr.addColorStop(0,"rgba(0,0,0,1)");gr.addColorStop(.6,"rgba(0,0,0,.8)");gr.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=gr;x.beginPath();x.arc(px,py,rd,0,7);x.fill()};
let last=null;
c.addEventListener("pointermove",e=>{const b=c.getBoundingClientRect(),px=(e.clientX-b.left)*w/b.width,py=(e.clientY-b.top)*h/b.height;el.style.setProperty("--mx",px/w*100+"%");el.style.setProperty("--my",py/h*100+"%");hint.style.opacity=0;
if(last){const dx=px-last[0],dy=py-last[1],n=Math.ceil(Math.hypot(dx,dy)/(rad/3))||1;for(let i=1;i<=n;i++)wipe(last[0]+dx*i/n,last[1]+dy*i/n,rad)}else wipe(px,py,rad);last=[px,py]});
c.addEventListener("pointerleave",()=>last=null);
let t=0;const sw=()=>{if(!c.isConnected)return;t+=.02;const p=Math.min(t,1);wipe(w*(.2+.6*p),h*(.85-.55*p)+Math.sin(p*9)*h*.05,rad*1.3);if(p<1)requestAnimationFrame(sw)};
setTimeout(sw,900);
const iv=setInterval(()=>{if(!c.isConnected)return clearInterval(iv);x.globalCompositeOperation="source-over";x.globalAlpha=.01;x.drawImage(f,0,0);x.globalAlpha=1},140)};
im.complete?go():im.onload=go}
function tarr(){const tg=$("#tg");if(!tg||tg._r)return;tg._r=1;let first=1;
const draw=()=>{const sv=$("#tsv");if(!sv||innerWidth<=860)return;const b=tg.getBoundingClientRect(),m=tg.querySelector(".tm .room").getBoundingClientRect();
sv.setAttribute("viewBox","0 0 "+b.width+" "+b.height);
let s='<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#547BFF" stroke="none"/></marker></defs>';
tg.querySelectorAll(".tk").forEach(c=>{const r=c.getBoundingClientRect(),lf=+c.dataset.i<4,y2=r.top+r.height/2-b.top,x2=(lf?r.right+7:r.left-7)-b.left,mx=m.left+m.width/2+(lf?-1:1)*m.width*.15-b.left,t0=m.top-b.top,y1=Math.min(Math.max(y2,t0+m.height*.14),t0+m.height*.52),xm=(x2+mx)/2;
s+='<path d="M'+mx+' '+y1+' C'+xm+' '+y1+' '+xm+' '+y2+' '+x2+' '+y2+'" marker-end="url(#ah)"/><circle cx="'+mx+'" cy="'+y1+'" r="4"/>'});
sv.innerHTML=s;
if(first&&!rm){first=0;sv.querySelectorAll("path").forEach((p,i)=>{const l=p.getTotalLength();p.style.strokeDasharray=l;p.style.strokeDashoffset=l;p.style.animationDelay=(.3+i*.12)+"s";const io=new IntersectionObserver(es=>{if(es[0].isIntersecting){p.classList.add("dr");io.disconnect()}},{threshold:.3});io.observe(tg)})}};
new ResizeObserver(draw).observe(tg);draw()}
const fx=()=>{tarr();document.querySelectorAll(".card,.pd .room.ph").forEach(tilt);const h=document.querySelector(".hero .room.ph");if(h)fog(h)};
new MutationObserver(fx).observe($("#app"),{childList:true});fx();
})();
</script>
